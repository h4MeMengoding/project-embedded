; Stasiun cuaca ESP32 DevKit V1. Lihat README.md untuk wiring dan langkah pemakaian.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:bump_version.py
board_build.filesystem = littlefs
; Firmware ~1,4 MB > slot OTA bawaan 1,25 MB. partitions_ota.csv: dua slot app 1,5 MB (OTA), LittleFS ~960 KB.
; Mengganti tabel partisi harus lewat USB (flash pertama); sesudahnya update bisa lewat OTA dari dashboard.
board_build.partitions = partitions_ota.csv
lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    claws/BH1750
    bblanchon/ArduinoJson@^7
    links2004/WebSockets@^2.6.1
