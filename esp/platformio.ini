; Stasiun cuaca ESP32 DevKit V1. Lihat README.md untuk wiring dan langkah pemakaian.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Firmware (Arduino-ESP32 3.x + TLS + WebSocket) ~1,3 MB > partisi app bawaan 1,25 MB. no_ota: app 2 MB, LittleFS ~1,9 MB.
board_build.partitions = no_ota.csv
lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    claws/BH1750
    bblanchon/ArduinoJson@^7
    links2004/WebSockets@^2.6.1

; Mode uji wiring/kalibrasi tanpa WiFi: pio run -e test -t upload && pio device monitor
[env:test]
extends = env:esp32doit-devkit-v1
build_flags = -DTEST_MODE=1
