<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6232">
<title>Offline · Stasiun Cuaca</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font-family: system-ui, -apple-system, sans-serif; color: #fff; text-align: center;
         background: linear-gradient(135deg, #1b6232 0%, #2c8640 52%, #4aa653 100%); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { margin: 0 0 24px; opacity: .85; max-width: 320px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 22px; padding: 10px 22px; background: #f7d04a; color: #2d2308; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi</h1>
    <p>Data cuaca butuh internet. Periksa koneksi lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
